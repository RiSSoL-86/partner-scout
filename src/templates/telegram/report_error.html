<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>{{ code }} · {{ title }}</title>
    <link rel="icon" href="data:,">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f2f3f5);
            --surface: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #16181c);
            --hint: var(--tg-theme-hint-color, #8a94a6);
            --border: rgba(128, 138, 157, 0.18);
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.04),
                0 8px 24px rgba(16, 24, 40, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: var(--tg-theme-bg-color, #17212b);
                --surface: var(--tg-theme-secondary-bg-color, #232e3c);
                --text: var(--tg-theme-text-color, #f5f5f5);
                --hint: var(--tg-theme-hint-color, #7d8b99);
                --border: rgba(148, 163, 184, 0.16);
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 32px 24px;
            text-align: center;
        }

        .icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }

        .code {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--hint);
        }

        h1 {
            margin: 6px 0 10px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p { margin: 0; color: var(--hint); font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <div class="code">Ошибка {{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
    </div>

    <script>
        (function () {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready();
            tg.expand();
        })();
    </script>
</body>
</html>
