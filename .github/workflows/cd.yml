name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/partner-scout
            git fetch --all
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            docker image prune -f

            # Give containers a moment to pass their healthchecks, then report.
            sleep 15
            echo "=== docker compose ps ==="
            docker compose ps
            # Fail the deploy if any service is not running (exited/restarting).
            if docker compose ps --quiet --status exited --status restarting --status dead | grep -q .; then
              echo "::error::One or more services are not running"
              docker compose ps
              exit 1
            fi
            echo "All services are up."
